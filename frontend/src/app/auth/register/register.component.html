<div class="auth-container">
  <div class="auth-card">
    <img src="logo-ori.png" alt="10-Yub Logo" class="auth-logo-img">

    <h2>Créez votre compte</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="name-avatar-group">
        <div class="form-group name-group">
          <i class="fa-solid fa-user input-icon"></i>
          <input type="text" id="name" formControlName="name" placeholder=" " />
          <label for="name">Nom</label>
        </div>
        <div class="avatar-picker">
          <label for="avatar-input" class="avatar-label">
            <img [src]="avatarPreview" *ngIf="avatarPreview" class="avatar-preview-img" alt="Aperçu de l'avatar">
            <img *ngIf="!avatarPreview" src="avatar-picker.png" alt="Choisir un avatar" class="avatar-icon-img">
          </label>
          <p class="avatar-text-label">Choisir un avatar</p>
          <input type="file" id="avatar-input" class="hidden-file-input" (change)="onFileSelect($event)">
        </div>
      </div>

      <div class="form-group">
        <i class="fa-jelly-duo fa-regular fa-envelope input-icon"></i>
        <input type="email" id="email" formControlName="email" placeholder=" " />
        <label for="email">Adresse e-mail</label>
      </div>

      <div class="form-group">
        <i class="fa-notdog fa-solid fa-key input-icon"></i>
        <input [type]="passwordVisible ? 'text' : 'password'" id="password" formControlName="password" placeholder=" " />
        <label for="password">Mot de passe</label>
        <!-- Eye icon -->
        <i *ngIf="!passwordVisible" (click)="togglePasswordVisibility()" class="fa-solid fa-eye password-toggle-icon"></i>
        <!-- Eye-slash icon -->
        <i *ngIf="passwordVisible" (click)="togglePasswordVisibility()" class="fa-solid fa-eye-slash password-toggle-icon"></i>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" class="cta-button" [disabled]="registerForm.invalid">Inscription</button>
    </form>

    <div class="divider">OU</div>

    <div class="social-login-container">
      <button class="social-button google">
        <img src="google-icon.png" alt="Google Icon" class="icon">
        Continuer avec Google
      </button>
      <button class="social-button facebook">
        <img src="facebook-logo.png" alt="Facebook Icon" class="icon">
        Continuer avec Facebook
      </button>
    </div>

    <p class="secondary-link">
      Déjà membre ? <a routerLink="/auth/login">Connectez-vous</a>
    </p>
  </div>
</div>
