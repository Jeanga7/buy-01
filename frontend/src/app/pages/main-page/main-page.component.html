<div class="main-page-container">
  <!-- A. Barre de Navigation Supérieure (Header) -->
  <header class="app-header card-bg rounded-3xl soft-shadow">
    <div class="header-left">
      <img src="logo-ori.png" alt="10-Yub Logo" class="header-logo">
    </div>
    <div class="header-center">
      <div class="search-bar rounded-3xl">
        <i class="fas fa-search search-icon"></i>
        <input type="text" placeholder="Search products...">
        <i class="fas fa-sliders-h filter-icon neon-purple-text"></i>
      </div>
    </div>
    <div class="header-right">
      <i class="far fa-heart icon-button"></i>
      <i class="far fa-bell icon-button"></i>
      <img src="https://via.placeholder.com/40" alt="User Avatar" class="user-avatar rounded-full">
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="main-content-grid">
    <!-- B. Bloc Principal (Hero/Mise en Avant) -->
    <section class="hero-section card-bg rounded-3xl soft-shadow">
      <div class="hero-content">
        <h2 class="hero-title">Performance Inspirante 10-Yub</h2>
        <p class="hero-subtitle">Clear Sounds, Immersive Experience.</p>
        <button class="cta-button rounded-3xl">Voir Tous les Produits</button>
      </div>
      <div class="hero-image-container">
        <img src="https://via.placeholder.com/300x250" alt="Main Product" class="hero-product-image">
        <div class="decorative-circle blue-primary"></div>
        <div class="decorative-line neon-purple"></div>
      </div>
    </section>

    <!-- C. Bloc Latéral Droit (Side Panel) -->
    <aside class="side-panel">
      <div class="popular-colors card-bg rounded-3xl soft-shadow">
        <h3>Popular Colors</h3>
        <div class="color-swatches">
          <div class="color-swatch blue-primary rounded-full"></div>
          <div class="color-swatch neon-purple rounded-full"></div>
          <div class="color-swatch cta-orange rounded-full"></div>
          <div class="color-swatch slate-gray rounded-full"></div>
          <div class="color-swatch light-gray rounded-full"></div>
        </div>
      </div>

      <div class="product-card card-bg rounded-3xl soft-shadow">
        <img src="https://via.placeholder.com/150x100" alt="New Gen X-Bud" class="product-image rounded-3xl">
        <h4>New Gen X-Bud</h4>
        <button class="action-button rounded-full"><i class="fas fa-arrow-right"></i></button>
      </div>

      <div class="product-card card-bg rounded-3xl soft-shadow">
        <img src="https://via.placeholder.com/150x100" alt="Light Grey Surface Headphone" class="product-image rounded-3xl">
        <h4>Light Grey Surface Headphone</h4>
        <button class="action-button rounded-full"><i class="fas fa-arrow-right"></i></button>
      </div>
    </aside>

    <!-- D. Grille Inférieure -->
    <section class="bottom-grid">
      <div class="more-products card-bg rounded-3xl soft-shadow">
        <h3>More Products</h3>
        <div class="product-avatars">
          <img src="https://via.placeholder.com/50" alt="Product 1" class="product-avatar rounded-full">
          <img src="https://via.placeholder.com/50" alt="Product 2" class="product-avatar rounded-full">
          <img src="https://via.placeholder.com/50" alt="Product 3" class="product-avatar rounded-full">
          <img src="https://via.placeholder.com/50" alt="Product 4" class="product-avatar rounded-full">
        </div>
      </div>

      <div class="reviews-card card-bg rounded-3xl soft-shadow blue-primary-accent">
        <h3>5M+ Downloads</h3>
        <div class="review-avatars">
          <img src="https://via.placeholder.com/40" alt="Reviewer 1" class="reviewer-avatar rounded-full">
          <img src="https://via.placeholder.com/40" alt="Reviewer 2" class="reviewer-avatar rounded-full">
          <img src="https://via.placeholder.com/40" alt="Reviewer 3" class="reviewer-avatar rounded-full">
        </div>
        <p>Excellent product, highly recommended!</p>
      </div>

      <div class="news-card card-bg rounded-3xl soft-shadow">
        <h3>Listening Has Been Released</h3>
        <p>Discover our new line of audio devices.</p>
        <button class="action-button rounded-full"><i class="fas fa-arrow-right"></i></button>
      </div>
    </section>
  </main>
</div>
