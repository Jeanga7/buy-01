spring.application.name=user-service
server.port=8081

#MongoDB config
spring.data.mongodb.uri=mongodb://localhost:27017/userdb

#Eureka Client config
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# --> supprime les identifiant de connexion
eureka.client.instance.prefer-ip-address=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.batch-size=16384
spring.kafka.producer.linger-ms=1
spring.kafka.producer.buffer-memory=33554432

# Kafka Topic Configuration
kafka.topic.user-events=user-events

## Error handling / 404 configuration
spring.mvc.throw-exception-if-no-handler-found=true
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always

## Resources mapping (désactive les mappages statiques si nécessaire)
# spring.web.resources.add-mappings=false

## Springdoc settings (optionnel)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
